  <text x="76" y="52" fill="#080B28" font-family="Inter, Sora, Arial, sans-serif" font-size="58" font-weight="800">App</text>
  <text x="184" y="52" fill="url(#labsGradient)" font-family="Inter, Sora, Arial, sans-serif" font-size="58" font-weight="800">Labs</text>
  <defs>
